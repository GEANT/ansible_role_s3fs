# At this stage we should have everything to mount
# TODO: warn if mountpoint is not empty and:
# - stop services
# - sync content to bucket/prefix
# - remove old content below mountpoint

- debug: var=_bucket
- debug: var=mount.s3_prefix

- name: Ensure bucket/prefix is mounted
  ansible.posix.mount:
    path: "{{ mount.local_dir }}"
    src: "{{ _bucket }}:/{{ mount.s3_prefix | regex_replace('^/', '') }}"
    fstype: fuse.s3fs
    opts: "{{ s3fs_flags | sort | join(',') }}"
    state: mounted
