---
- name: Ensure required packages are installed
  ansible.builtin.apt:
    name:
      - s3fs
      - rsync
  become: true

# TODO safety/sanity checks here, before we start doing work

- name: Ensure mounts are available
  block:
    - name: Include mount tasks
      ansible.builtin.include_tasks:
        file: mount.yml
      loop: "{{ s3fs_mounts }}"
      loop_control:
        loop_var: mount
  vars:
    __access_key: "{{ mount.access_key | default(s3fs_access_key | default('')) }}"
    __secret_key: "{{ mount.secret_key | default(s3fs_secret_key | default('')) }}"
    __region: "{{ mount.region | default(s3fs_region | default('')) }}"
    has_static_credentials: "{{ __access_key | length > 0 and __secret_key | length > 0 }}"
    s3fs_auth_flags:
      - "{{ ('passwd_file=' ~ s3fs_password_file) if has_static_credentials else 'iam_role=auto' }}"
  environment: >
    {{
      ({'AWS_ACCESS_KEY_ID': __access_key} if __access_key else {}) |
      combine({'AWS_SECRET_ACCESS_KEY': __secret_key} if __secret_key else {}) |
      combine({'AWS_REGION': __region, 'AWS_DEFAULT_REGION': __region} if __region else {})
    }}
